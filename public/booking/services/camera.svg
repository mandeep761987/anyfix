<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="lensBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="camShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#camShadow)">
    <!-- Camera Plateau Island (Curved Squircle) -->
    <rect x="55" y="55" width="130" height="130" rx="30" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
    
    <!-- Top-Left Main Lens Ring -->
    <circle cx="92" cy="92" r="24" fill="url(#lensBezel)" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="92" cy="92" r="20" fill="url(#lensGlass)"/>
    <circle cx="92" cy="92" r="11" fill="#020617"/>
    <circle cx="88" cy="88" r="4" fill="#38BDF8" opacity="0.7"/>
    <circle cx="96" cy="96" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Bottom-Left Ultra-Wide Lens Ring -->
    <circle cx="92" cy="148" r="24" fill="url(#lensBezel)" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="92" cy="148" r="20" fill="url(#lensGlass)"/>
    <circle cx="92" cy="148" r="11" fill="#020617"/>
    <circle cx="88" cy="144" r="4" fill="#38BDF8" opacity="0.7"/>
    <circle cx="96" cy="152" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Right Telephoto Lens Ring -->
    <circle cx="148" cy="120" r="24" fill="url(#lensBezel)" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="148" cy="120" r="20" fill="url(#lensGlass)"/>
    <circle cx="148" cy="120" r="11" fill="#020617"/>
    <circle cx="144" cy="116" r="4" fill="#38BDF8" opacity="0.7"/>
    <circle cx="152" cy="124" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Dual Tone Flash -->
    <circle cx="148" cy="78" r="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="148" cy="78" r="6" fill="#FEF08A"/>

    <!-- LiDAR Scanner -->
    <circle cx="148" cy="162" r="7" fill="#020617" stroke="#475569" stroke-width="1"/>
    <circle cx="148" cy="162" r="3" fill="#0F172A"/>
  </g>
</svg>