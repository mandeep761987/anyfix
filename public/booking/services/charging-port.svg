<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="phoneBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="chargeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#chargeShadow)">
    <!-- Phone Bottom Chassis -->
    <rect x="30" y="72" width="180" height="24" rx="8" fill="url(#phoneBottom)" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Pentalobe screws -->
    <circle cx="92" cy="84" r="2.5" fill="#334155" stroke="#64748B" stroke-width="0.5"/>
    <circle cx="148" cy="84" r="2.5" fill="#334155" stroke="#64748B" stroke-width="0.5"/>
    
    <!-- Speaker holes on left and right -->
    <circle cx="55" cy="84" r="2.5" fill="#0F172A"/>
    <circle cx="64" cy="84" r="2.5" fill="#0F172A"/>
    <circle cx="73" cy="84" r="2.5" fill="#0F172A"/>
    <circle cx="167" cy="84" r="2.5" fill="#0F172A"/>
    <circle cx="176" cy="84" r="2.5" fill="#0F172A"/>
    <circle cx="185" cy="84" r="2.5" fill="#0F172A"/>

    <!-- USB-C / Lightning Port Cutout -->
    <rect x="104" y="78" width="32" height="12" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
    <!-- Center contact tongue / pin -->
    <rect x="110" y="83" width="20" height="2.5" rx="1" fill="#F59E0B"/>

    <!-- USB-C Cable Head Plugged in / Approaching -->
    <!-- Metal Plug -->
    <rect x="107" y="92" width="26" height="16" rx="4" fill="#94A3B8" stroke="#64748B" stroke-width="1"/>
    <rect x="112" y="95" width="16" height="4" rx="1" fill="#1E293B" opacity="0.4"/>
    
    <!-- Glossy White Cable Collar -->
    <rect x="102" y="106" width="36" height="52" rx="8" fill="url(#cableGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="110" y1="106" x2="110" y2="158" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Strain relief -->
    <path d="M113 158 L127 158 L125 180 L115 180 Z" fill="#CBD5E1"/>
    
    <!-- White Cable Cord -->
    <rect x="114" y="180" width="12" height="42" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Subtle Blue Power Glow -->
    <circle cx="120" cy="84" r="16" fill="#38BDF8" opacity="0.2" filter="blur(4px)"/>
  </g>
</svg>