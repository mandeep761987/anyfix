<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="glassMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="crackGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#crackGlow)">
    <!-- Smartphone Back Glass Panel -->
    <rect x="65" y="25" width="110" height="190" rx="20" fill="url(#glassMatte)" stroke="#64748B" stroke-width="2"/>
    
    <!-- Camera Plateau Island -->
    <rect x="75" y="35" width="46" height="46" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <circle cx="88" cy="48" r="8" fill="#020617" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="108" cy="48" r="8" fill="#020617" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="88" cy="68" r="8" fill="#020617" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="108" cy="68" r="3.5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>

    <!-- Subtle Centered Brand Logo Silhouette -->
    <circle cx="120" cy="120" r="10" fill="#64748B" opacity="0.4"/>

    <!-- Shattered / Fractured Spiderweb Crack Lines with refraction -->
    <g stroke="#FFFFFF" stroke-linecap="round" opacity="0.85">
      <!-- Main impact center point -->
      <circle cx="138" cy="145" r="3" fill="#FFFFFF"/>
      <!-- Radiating cracks -->
      <path d="M138 145 L115 130 L95 142 L66 148" stroke-width="1.8" fill="none"/>
      <path d="M138 145 L155 125 L174 110" stroke-width="1.8" fill="none"/>
      <path d="M138 145 L145 170 L135 195 L142 214" stroke-width="1.8" fill="none"/>
      <path d="M138 145 L160 160 L174 180" stroke-width="1.8" fill="none"/>
      <path d="M115 130 L108 105 L90 85" stroke-width="1.4" fill="none"/>
      <path d="M138 145 L130 115 L121 82" stroke-width="1.4" fill="none"/>
      <!-- Secondary branching web cracks -->
      <path d="M125 138 L142 120 L135 98" stroke-width="1" opacity="0.6" fill="none"/>
      <path d="M105 136 L118 152 L108 178 L78 185" stroke-width="1" opacity="0.6" fill="none"/>
      <path d="M150 152 L162 138 L170 148" stroke-width="1" opacity="0.6" fill="none"/>
      <path d="M136 182 L152 190 L168 205" stroke-width="1" opacity="0.6" fill="none"/>
    </g>

    <!-- Frosted matte sheen reflection -->
    <path d="M68 28 L150 28 L100 212 L68 212 Z" fill="#FFFFFF" opacity="0.08"/>
  </g>
</svg>