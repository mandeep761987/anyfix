<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="batBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="batShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#batShadow)">
    <!-- Copper Flex Connector Header -->
    <path d="M140 32 L158 32 L158 54 L140 54 Z" fill="#B45309" stroke="#78350F" stroke-width="1"/>
    <rect x="144" y="28" width="10" height="6" rx="1" fill="url(#goldPin)"/>
    <circle cx="149" cy="38" r="2" fill="#FDE68A"/>

    <!-- Main Battery Cell Body -->
    <rect x="65" y="46" width="110" height="162" rx="10" fill="url(#batBody)" stroke="#334155" stroke-width="2"/>
    
    <!-- Top/Bottom sealing margins -->
    <line x1="67" y1="56" x2="173" y2="56" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="67" y1="198" x2="173" y2="198" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Battery Specs Print -->
    <g fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8" font-weight="600">
      <!-- Apple style battery logo / lightning badge -->
      <path d="M120 72 L112 86 L119 86 L116 100 L128 84 L121 84 Z" fill="#38BDF8"/>
      <text x="80" y="116" fill="#F1F5F9" font-size="9" font-weight="bold">Li-ion RECHARGEABLE</text>
      <text x="80" y="128">3.85V 4422mAh · 17.1Wh</text>
      <text x="80" y="139">Secondary Li-ion Battery</text>
      <text x="80" y="150">WARNING: Fire Hazard</text>
      
      <!-- Certification marks -->
      <rect x="80" y="162" width="18" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1"/>
      <text x="84" y="171" font-size="7" fill="#94A3B8">CE</text>
      <circle cx="112" cy="168" r="6" fill="none" stroke="#64748B" stroke-width="1"/>
      <text x="108" y="170" font-size="6" fill="#94A3B8">UL</text>
      <rect x="130" y="162" width="28" height="12" rx="2" fill="#1E3A8A" opacity="0.6"/>
      <text x="133" y="171" font-size="7" fill="#93C5FD">100%</text>
    </g>

    <!-- Metallic shine on foil edge -->
    <line x1="68" y1="50" x2="68" y2="204" stroke="#94A3B8" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>