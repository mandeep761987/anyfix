<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glassGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#dropShadow)">
    <!-- Backing chassis plate -->
    <rect x="52" y="22" width="100" height="180" rx="16" fill="url(#chassis)" stroke="#94A3B8" stroke-width="1.5"/>
    
    <!-- OLED Screen Assembly (offset front display panel) -->
    <rect x="82" y="28" width="104" height="184" rx="18" fill="#020617" stroke="#475569" stroke-width="2"/>
    <!-- Display active area with vibrant blue wallpaper -->
    <rect x="86" y="32" width="96" height="176" rx="15" fill="url(#screenBg)"/>
    
    <!-- Dynamic OLED wallpaper graphic -->
    <path d="M86 110 C 110 80, 140 160, 182 130 L182 208 L86 208 Z" fill="url(#glassGlint)" opacity="0.7"/>
    <circle cx="134" cy="120" r="28" fill="#38BDF8" opacity="0.4" filter="blur(4px)"/>
    
    <!-- Dynamic Island / Speaker cutout -->
    <rect x="118" y="38" width="32" height="10" rx="5" fill="#000000" stroke="#1E293B" stroke-width="0.5"/>
    <circle cx="142" cy="43" r="2" fill="#1E3A8A"/>

    <!-- Ribbon Flex Cable at bottom -->
    <path d="M110 216 L110 228 L140 228 L140 216 Z" fill="#B45309" stroke="#78350F" stroke-width="1"/>
    <rect x="116" y="224" width="18" height="4" rx="1" fill="#F59E0B"/>
    <line x1="118" y1="226" x2="132" y2="226" stroke="#78350F" stroke-width="1" stroke-dasharray="1 1"/>

    <!-- Diagonal Glass Glare -->
    <path d="M90 34 L170 34 L110 190 L90 190 Z" fill="#FFFFFF" opacity="0.15"/>
  </g>
</svg>