<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="splashFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#0369A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#splashFilter)">
    <!-- Submerged Smartphone silhouette -->
    <g transform="rotate(-12 120 120)">
      <rect x="75" y="35" width="90" height="170" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <rect x="80" y="42" width="80" height="156" rx="14" fill="url(#waterBg)"/>
      <circle cx="120" cy="52" r="3" fill="#020617"/>
    </g>

    <!-- Translucent water splash ripples -->
    <path d="M35 150 C 60 130, 90 170, 120 145 C 150 120, 180 160, 205 140 L205 205 C 170 215, 70 215, 35 205 Z" fill="#0EA5E9" opacity="0.55"/>
    <path d="M45 165 C 75 145, 105 180, 135 160 C 165 140, 195 175, 205 160 L205 205 L45 205 Z" fill="#38BDF8" opacity="0.4"/>

    <!-- Dynamic Water Droplets -->
    <circle cx="70" cy="95" r="7" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    <circle cx="68" cy="93" r="2" fill="#FFFFFF"/>

    <circle cx="165" cy="80" r="9" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9"/>
    <circle cx="162" cy="77" r="2.5" fill="#FFFFFF"/>

    <circle cx="175" cy="125" r="5" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <circle cx="55" cy="135" r="4" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <circle cx="120" cy="85" r="6" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1" opacity="0.9"/>
    <circle cx="118" cy="83" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>