<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="othShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#othShadow)">
    <!-- Precision Screwdriver & Spudger Tool Crossed -->
    <!-- Tool 1: Precision Screwdriver -->
    <g transform="rotate(-35 120 120)">
      <rect x="116" y="40" width="8" height="100" rx="3" fill="#94A3B8" stroke="#475569" stroke-width="1"/>
      <!-- Knurled grip -->
      <rect x="114" y="60" width="12" height="40" rx="2" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1"/>
      <!-- Driver tip -->
      <path d="M118 140 L122 140 L121 165 L119 165 Z" fill="#334155"/>
      <!-- Swivel top -->
      <circle cx="120" cy="38" r="7" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    </g>

    <!-- Tool 2: Blue Nylon Spudger / Pry Tool -->
    <g transform="rotate(35 120 120)">
      <rect x="115" y="45" width="10" height="115" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
      <path d="M115 160 L125 160 L120 178 Z" fill="#0284C7"/>
      <circle cx="120" cy="55" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Inspection Magnifier / Gear accent -->
    <circle cx="120" cy="120" r="16" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
    <path d="M114 120 L126 120 M120 114 L120 126" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>