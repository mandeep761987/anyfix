<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="sideChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="btnMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="btnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="24" fill="#F8FAFC"/>
  <circle cx="120" cy="120" r="95" fill="#EFF6FF" opacity="0.7"/>

  <g filter="url(#btnShadow)">
    <!-- Macro angled smartphone titanium/aluminum side frame -->
    <path d="M80 25 L145 25 L165 215 L100 215 Z" fill="url(#sideChassis)" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Antenna band line -->
    <line x1="88" y1="65" x2="153" y2="65" stroke="#1E293B" stroke-width="3"/>
    <line x1="96" y1="180" x2="161" y2="180" stroke="#1E293B" stroke-width="3"/>

    <!-- Action Button -->
    <rect x="72" y="80" width="12" height="20" rx="3" fill="url(#btnMetallic)" stroke="#475569" stroke-width="1"/>
    <rect x="74" y="82" width="8" height="16" rx="2" fill="#F97316" opacity="0.8"/>

    <!-- Volume Up Button -->
    <rect x="74" y="112" width="12" height="36" rx="4" fill="url(#btnMetallic)" stroke="#475569" stroke-width="1"/>
    <line x1="78" y1="120" x2="78" y2="140" stroke="#94A3B8" stroke-width="1"/>

    <!-- Volume Down Button -->
    <rect x="78" y="156" width="12" height="36" rx="4" fill="url(#btnMetallic)" stroke="#475569" stroke-width="1"/>
    <line x1="82" y1="164" x2="82" y2="184" stroke="#94A3B8" stroke-width="1"/>

    <!-- Highlighting chamfered bevels -->
    <line x1="81" y1="25" x2="101" y2="215" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  </g>
</svg>