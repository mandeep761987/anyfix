<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad4)" />

  <!-- Soft glowing warranty shield in the background center -->
  <g transform="translate(500, 280)" opacity="0.12">
    <path d="M0 -180 L140 -100 C140 60 0 180 0 180 C0 180 -140 60 -140 -100 Z" fill="#1D4ED8" stroke="#60A5FA" stroke-width="8" />
  </g>

  <!-- Customer Character (Left, relaxed at home on couch holding freshly repaired phone) -->
  <g transform="translate(260, 240)" filter="url(#shadow4)">
    <!-- Sofa Base & Cushion -->
    <rect x="-100" y="160" width="220" height="75" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <rect x="-115" y="100" width="40" height="120" rx="14" fill="#334155" />

    <!-- Customer Head -->
    <circle cx="20" cy="40" r="30" fill="#FED7AA" />
    <!-- Hair -->
    <path d="M-5 35 C-10 15 15 10 35 10 C55 10 55 25 50 45 C45 30 25 25 -5 35 Z" fill="#64748B" />
    <path d="M8 48 Q20 58 32 48" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Body / Loungewear -->
    <path d="M-20 85 C-25 130 -15 190 5 200 L55 200 C75 190 80 130 70 85 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />

    <!-- Holding smartphone displaying ANYFIX warranty pass -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="70" height="110" rx="10" fill="#0F172A" stroke="#22C55E" stroke-width="2" />
      <circle cx="35" cy="35" r="16" fill="#22C55E" fill-opacity="0.2" />
      <path d="M28 35 L33 40 L42 30" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" />
      <text x="35" y="65" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">WARRANTY</text>
      <text x="35" y="77" text-anchor="middle" fill="#86EFAC" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900">ACTIVE</text>
      <text x="35" y="92" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="6">180 Days Left</text>
    </g>
  </g>

  <!-- Warranty Card (Center-Right, floating card showing comprehensive support) -->
  <g transform="translate(560, 140)" filter="url(#shadow4)">
    <rect x="0" y="0" width="360" height="370" rx="24" fill="#1E293B" stroke="#334155" stroke-width="2" />
    
    <!-- Header banner -->
    <rect x="0" y="0" width="360" height="64" rx="24" fill="#0F172A" />
    <rect x="0" y="44" width="360" height="20" fill="#0F172A" />
    <g transform="translate(24, 18)">
      <circle cx="16" cy="14" r="14" fill="#1D4ED8" />
      <path d="M11 14 L15 18 L22 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <text x="42" y="14" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">ANYFIX CARE GUARANTEE</text>
      <text x="42" y="28" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Hassle-free doorstep warranty resolution</text>
    </g>

    <!-- Support Feature 1 -->
    <g transform="translate(24, 85)">
      <circle cx="20" cy="20" r="16" fill="#0F172A" stroke="#1D4ED8" stroke-width="2" />
      <text x="20" y="25" text-anchor="middle" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">1</text>
      <text x="48" y="16" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">6-Month Comprehensive Warranty</text>
      <text x="48" y="32" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Full coverage for touch, display &amp; genuine part integrity.</text>
    </g>

    <!-- Support Feature 2 -->
    <g transform="translate(24, 150)">
      <circle cx="20" cy="20" r="16" fill="#0F172A" stroke="#10B981" stroke-width="2" />
      <text x="20" y="25" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">2</text>
      <text x="48" y="16" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Zero-Hassle Re-Visit</text>
      <text x="48" y="32" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">If any issue recurs, technician revisits you with priority.</text>
    </g>

    <!-- Support Feature 3 -->
    <g transform="translate(24, 215)">
      <circle cx="20" cy="20" r="16" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
      <text x="20" y="25" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">3</text>
      <text x="48" y="16" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Direct Support Hotline</text>
      <text x="48" y="32" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Real human assistance on WhatsApp &amp; phone.</text>
    </g>

    <!-- Bottom reassurance stamp -->
    <g transform="translate(24, 285)">
      <rect x="0" y="0" width="312" height="60" rx="14" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#1D4ED8" fill-opacity="0.2" />
      <path d="M22 30 L26 34 L34 26" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
      <text x="52" y="25" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">NO QUESTIONS ASKED CLAIM</text>
      <text x="52" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Digital invoice sent right to your email &amp; WhatsApp.</text>
    </g>
  </g>
</svg>
