<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="650" fill="url(#bgGrad1)" />

  <!-- Overhead Shop Ceiling Grid & Fluorescent Dim Lamp -->
  <line x1="0" y1="90" x2="1000" y2="90" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />
  <rect x="420" y="0" width="160" height="18" fill="#475569" rx="4" />
  <line x1="500" y1="18" x2="500" y2="70" stroke="#64748B" stroke-width="3" />
  <polygon points="460,70 540,70 570,95 430,95" fill="#64748B" />
  <ellipse cx="500" cy="95" rx="70" ry="12" fill="#FEF3C7" opacity="0.8" />
  <polygon points="430,95 570,95 850,550 150,550" fill="url(#lampGlow)" />

  <!-- Wall Clock Showing Hours Passing (Ticking clock metaphor) -->
  <g transform="translate(180, 150)" filter="url(#shadow1)">
    <circle cx="0" cy="0" r="54" fill="#1E293B" stroke="#64748B" stroke-width="4" />
    <circle cx="0" cy="0" r="48" fill="#0F172A" />
    <circle cx="0" cy="0" r="4" fill="#EF4444" />
    <!-- Clock hour markers -->
    <line x1="0" y1="-42" x2="0" y2="-34" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="0" x2="34" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="42" x2="0" y2="34" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <line x1="-42" y1="0" x2="-34" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
    <!-- Clock hands indicating endless wait -->
    <line x1="0" y1="0" x2="18" y2="-22" stroke="#F1F5F9" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-24" y2="14" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
    <!-- Speed arcs -->
    <path d="M-65 -20 A68 68 0 0 1 -20 -65" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 4" />
    <text x="0" y="80" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1">4+ HOURS WAITING</text>
  </g>

  <!-- Traditional Shop Counter (Disorganized, clutter) -->
  <g transform="translate(620, 240)" filter="url(#shadow1)">
    <!-- Shop counter base -->
    <rect x="-160" y="160" width="340" height="190" fill="#1E293B" rx="12" stroke="#334155" stroke-width="2" />
    <!-- Countertop surface -->
    <rect x="-180" y="145" width="380" height="20" fill="#334155" rx="6" />
    <!-- Clutter & Unsorted phone parts boxes -->
    <rect x="-140" y="90" width="75" height="55" fill="#475569" rx="4" />
    <rect x="-135" y="96" width="65" height="14" fill="#64748B" rx="2" />
    <rect x="-55" y="115" width="60" height="30" fill="#64748B" rx="4" />
    <rect x="20" y="80" width="90" height="65" fill="#334155" rx="4" stroke="#475569" stroke-width="1.5" />
    <!-- "CLOSED / PLEASE WAIT" Sign -->
    <rect x="130" y="105" width="60" height="40" fill="#EF4444" rx="4" />
    <text x="160" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">WAIT 3-5</text>
    <text x="160" y="139" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">DAYS</text>
  </g>

  <!-- Tired Waiting Customer Figure sitting on plastic chair -->
  <g transform="translate(480, 250)" filter="url(#shadow1)">
    <!-- Waiting Chair -->
    <path d="M-60 210 L-60 140 L-10 140 L-10 210" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <rect x="-70" y="130" width="80" height="12" rx="4" fill="#3B82F6" opacity="0.7" />
    <rect x="-72" y="50" width="14" height="85" rx="4" fill="#3B82F6" opacity="0.7" />

    <!-- Customer Body (Slumped forward, hand on head) -->
    <!-- Head -->
    <circle cx="-15" cy="40" r="28" fill="#FDBA74" />
    <!-- Hair -->
    <path d="M-42 35 C-42 15 -25 15 -10 15 C8 15 15 25 15 38 C8 32 -10 32 -25 35 Z" fill="#334155" />
    <!-- Frustration gesture hand holding temple -->
    <path d="M-38 32 C-45 38 -45 52 -36 55 C-30 52 -32 40 -38 32 Z" fill="#FDBA74" />
    <!-- Torso (Dark jacket) -->
    <path d="M-45 70 C-50 110 -40 140 -20 145 L20 145 C30 130 25 90 10 70 Z" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Bent legs -->
    <path d="M-20 145 L-30 205 L-55 240" fill="none" stroke="#0F172A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 145 L5 205 L-20 240" fill="none" stroke="#1E293B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Shoes -->
    <rect x="-75" y="235" width="40" height="16" rx="8" fill="#334155" />
    <rect x="-40" y="235" width="40" height="16" rx="8" fill="#475569" />

    <!-- Waiting token slip in hand showing "#87" -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="42" height="52" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="21" y="16" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">TOKEN</text>
      <text x="21" y="36" text-anchor="middle" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">#87</text>
      <text x="21" y="46" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="600">Now Serving: #42</text>
    </g>

    <!-- Thought / Frustration bubble -->
    <g transform="translate(-150, -40)" opacity="0.95">
      <rect x="0" y="0" width="180" height="64" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
      <polygon points="140,64 150,82 125,64" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
      <rect x="123" y="60" width="22" height="6" fill="#1E293B" />
      <text x="90" y="26" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Another 3 hours lost?</text>
      <text x="90" y="46" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Traditional repair is exhausting.</text>
    </g>
  </g>
</svg>
