<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad5)" />

  <!-- City / Residential Silhouette in background -->
  <g opacity="0.15">
    <rect x="50" y="300" width="120" height="250" fill="#93C5FD" />
    <rect x="190" y="240" width="140" height="310" fill="#93C5FD" />
    <rect x="350" y="280" width="100" height="270" fill="#93C5FD" />
    <rect x="750" y="260" width="150" height="290" fill="#93C5FD" />
    <line x1="0" y1="550" x2="1000" y2="550" stroke="#60A5FA" stroke-width="2" />
  </g>

  <!-- Ground Path / Doorstep Patio -->
  <rect x="0" y="520" width="1000" height="130" fill="#0F172A" />
  <line x1="0" y1="520" x2="1000" y2="520" stroke="#334155" stroke-width="3" />

  <!-- ANYFIX Mobile Doorstep Service Vehicle (Left) -->
  <g transform="translate(180, 310)" filter="url(#shadow5)">
    <!-- Van Body -->
    <path d="M-90 190 L-90 60 C-90 35 -75 20 -40 20 L90 20 C120 20 140 40 160 70 L190 110 L220 120 C235 125 240 140 240 160 L240 190 Z" fill="#F8FAFC" />
    <!-- Blue Brand Band -->
    <path d="M-90 120 L240 120 L240 170 L-90 170 Z" fill="#1D4ED8" />
    <!-- ANYFIX Logo on Van -->
    <text x="50" y="152" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">ANYFIX</text>
    <text x="140" y="150" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">DOORSTEP REPAIR</text>

    <!-- Van Windows -->
    <path d="M100 35 L150 35 L175 75 L100 75 Z" fill="#1E293B" rx="4" />
    <path d="M-10 35 L90 35 L90 75 L-10 75 Z" fill="#334155" rx="4" />

    <!-- Wheels -->
    <g transform="translate(-20, 190)">
      <circle cx="0" cy="0" r="32" fill="#0F172A" />
      <circle cx="0" cy="0" r="18" fill="#475569" stroke="#94A3B8" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#F8FAFC" />
    </g>
    <g transform="translate(165, 190)">
      <circle cx="0" cy="0" r="32" fill="#0F172A" />
      <circle cx="0" cy="0" r="18" fill="#475569" stroke="#94A3B8" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#F8FAFC" />
    </g>

    <!-- Headlight beam -->
    <polygon points="240,140 240,165 390,200 390,120" fill="#FEF08A" opacity="0.25" />
  </g>

  <!-- ANYFIX Certified Technician (Center-Right, holding precision tool case & greeting) -->
  <g transform="translate(570, 260)" filter="url(#shadow5)">
    <!-- Technician Body -->
    <path d="M-45 100 C-50 150 -35 230 -10 240 L35 240 C60 230 65 150 55 100 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2" />
    <!-- White inner collar -->
    <polygon points="-12,100 0,128 12,100" fill="#F8FAFC" />
    <!-- ANYFIX ID Badge on lanyard -->
    <rect x="-14" y="140" width="28" height="38" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="0" cy="152" r="6" fill="#1D4ED8" />
    <rect x="-9" y="162" width="18" height="3" fill="#64748B" rx="1" />
    <rect x="-6" y="168" width="12" height="3" fill="#1D4ED8" rx="1" />

    <!-- Head -->
    <circle cx="0" cy="50" r="32" fill="#FDBA74" />
    <path d="M-34 45 C-34 18 -10 16 0 16 C15 16 34 20 34 45 C25 35 0 32 -34 45 Z" fill="#0F172A" />
    <path d="M-38 38 C-28 32 10 32 42 36 C48 36 48 42 38 44 C10 40 -25 40 -38 38 Z" fill="#1E40AF" />
    <!-- Friendly Smile -->
    <path d="M-10 60 Q0 70 10 60" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Left hand holding certified precision toolkit -->
    <g transform="translate(-75, 170)">
      <rect x="0" y="0" width="54" height="68" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <rect x="15" y="-10" width="24" height="12" rx="4" fill="none" stroke="#94A3B8" stroke-width="3" />
      <circle cx="27" cy="34" r="10" fill="#1D4ED8" />
      <path d="M22 34 L25 37 L32 30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="27" y="58" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="700">ANYFIX LAB</text>
    </g>

    <!-- Right hand greeting wave -->
    <path d="M45 120 Q80 90 95 65" fill="none" stroke="#FDBA74" stroke-width="18" stroke-linecap="round" />
    <circle cx="102" cy="58" r="10" fill="#FDBA74" />
  </g>

  <!-- Doorstep Entryway / Welcoming Customer (Right) -->
  <g transform="translate(800, 230)" filter="url(#shadow5)">
    <!-- Modern Doorway frame -->
    <rect x="-60" y="40" width="170" height="260" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <!-- Glass panel glow -->
    <rect x="-40" y="60" width="130" height="220" rx="4" fill="#334155" fill-opacity="0.4" />
    <!-- Welcoming homeowner smiling -->
    <circle cx="20" cy="110" r="28" fill="#FED7AA" />
    <path d="M-5 105 C-10 85 15 80 35 80 C55 80 55 95 50 115 C45 100 25 95 -5 105 Z" fill="#64748B" />
    <path d="M8 118 Q20 128 32 118" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <path d="M-15 155 C-20 200 -10 260 10 270 L50 270 C70 260 75 200 65 155 Z" fill="#38BDF8" />
  </g>

  <!-- Floating "30-45 MIN REPAIR AT HOME" Guarantee Stamp -->
  <g transform="translate(480, 100)" filter="url(#shadow5)">
    <rect x="0" y="0" width="260" height="60" rx="30" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <circle cx="34" cy="30" r="18" fill="#1D4ED8" />
    <path d="M34 20 V30 H40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="66" y="27" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900">30-45 MINUTE REPAIR</text>
    <text x="66" y="44" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11">Repaired right before your eyes</text>
  </g>
</svg>
